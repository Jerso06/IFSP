<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/contato_style.css">
    <title>Buongustaio - Fale conosco</title>
</head>

<body>
    <header>
        <div id="links">
            <a href="/">Home</a>
            <a href="/cardapio">Cardápio</a>
            <a href="#"> Fale Conosco</a>
        </div>

        <p id="name">Buongustaio</p>
    </header>

    <main>
        <form action="/fale-conosco" method="post">
            <h1>Fale Conosco</h1>

            <section>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </section>

            <section>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Informe seu email">
            </section>

            <section>
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" placeholder="Assunto">
            </section>

            <section>
                <label for="mensagem">Mensagem:</label>
                <textarea name="mensagem" id="mensagem" placeholder="Mensagem"></textarea>
            </section>

            <input type="submit" value="Enviar">
        </form>
    </main>
</body>

</html>
